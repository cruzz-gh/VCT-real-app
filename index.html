<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCT Live Matches</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #ff4655; }
    .card { background: #1e293b; padding: 15px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff4655; }
    .tournament { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
    .teams { font-size: 1.1rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .score { background: #0f172a; padding: 4px 10px; border-radius: 4px; color: #38bdf8; }
    .loading { text-align: center; color: #94a3b8; margin-top: 40px; }
  </style>
</head>
<body>

  <h1>VCT Match Results</h1>
  <div id="results" class="loading">Loading live matches...</div>

  <script>
    async function fetchVCT() {
      const container = document.getElementById('results');
      try {
        const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://vlr.orlandomm.net/api/v1/results'));
        const json = await res.json();
        
        if (json.data && json.data.segments) {
          container.innerHTML = '';
          json.data.segments.slice(0, 10).forEach(match => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="tournament">${match.tournament || 'VCT Match'}</div>
              <div class="teams">
                <span>${match.team1} vs ${match.team2}</span>
                <span class="score">${match.score1 || '0'} - ${match.score2 || '0'}</span>
              </div>
            `;
            container.appendChild(card);
          });
        }
      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444; text-align: center;">Failed to load match data.</p>`;
      }
    }

    fetchVCT();
  </script>
</body>
</html>

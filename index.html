<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCT Live Matches</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #ff4655; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 16px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff4655; }
    .tournament { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    .teams { font-size: 1.05rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .score { background: #0f172a; padding: 6px 12px; border-radius: 4px; color: #38bdf8; font-weight: 700; white-space: nowrap; }
    .status-msg { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>VCT Match Results</h1>
  <div id="results" class="status-msg">Loading live matches...</div>

  <script>
    async function loadMatches() {
      const container = document.getElementById('results');

      const endpoints = [
        'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://vlr.orlandomm.net/api/v1/results'),
        'https://corsproxy.io/?' + encodeURIComponent('https://vlr.orlandomm.net/api/v1/results')
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;

          const json = await res.json();
          const matches = json.data?.segments || json.data || [];

          if (Array.isArray(matches) && matches.length > 0) {
            container.innerHTML = '';
            let renderedCount = 0;

            matches.forEach(m => {
              if (renderedCount >= 10) return;

              // Team extraction
              const t1 = m.teams?.[0];
              const t2 = m.teams?.[1];
              const team1 = typeof t1 === 'object' ? (t1.name || t1.tag) : (m.team1 || 'TBD');
              const team2 = typeof t2 === 'object' ? (t2.name || t2.tag) : (m.team2 || 'TBD');

              // Score extraction logic specifically for VLR results
              let s1 = typeof t1 === 'object' ? t1.score : m.score1;
              let s2 = typeof t2 === 'object' ? t2.score : m.score2;

              let scoreDisplay = '';
              if (s1 !== undefined && s2 !== undefined && s1 !== null && s2 !== null) {
                scoreDisplay = `${s1} - ${s2}`;
              } else if (m.score && m.score !== '-') {
                scoreDisplay = m.score;
              } else {
                // If the match is unplayed/scheduled without scores, skip it
                return;
              }

              const tournament = m.tournament || m.event || 'VCT Tournament';

              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <div class="tournament">${tournament}</div>
                <div class="teams">
                  <span>${team1} vs ${team2}</span>
                  <span class="score">${scoreDisplay}</span>
                </div>
              `;
              container.appendChild(card);
              renderedCount++;
            });

            if (renderedCount > 0) return; // Exit on successful render
          }
        } catch (err) {
          console.warn('Endpoint failed:', url, err);
        }
      }

      container.innerHTML = `<p style="color: #ef4444;">Unable to load match results right now. Please refresh.</p>`;
    }

    loadMatches();
  </script>
</body>
</html>

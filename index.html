<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCT Live Matches</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #ff4655; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 16px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff4655; }
    .tournament { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    .teams { font-size: 1.05rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .score { background: #0f172a; padding: 6px 12px; border-radius: 4px; color: #38bdf8; font-weight: 700; white-space: nowrap; }
    .status-msg { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>VCT Match Results</h1>
  <div id="results" class="status-msg">Loading live matches...</div>

  <script>
    async function loadMatches() {
      const container = document.getElementById('results');

      // Array of proxies to try sequentially if one fails/blocks
      const targetApi = 'https://vlr.orlandomm.net/api/v1/results';
      const proxyUrls = [
        `https://corsproxy.io/?${encodeURIComponent(targetApi)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetApi)}`,
        `https://thingproxy.freeboard.io/fetch/${targetApi}`
      ];

      for (const url of proxyUrls) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;

          const text = await res.text();
          let json;
          try {
            json = JSON.parse(text);
          } catch (e) {
            continue; // Not valid JSON (e.g. proxy error page)
          }

          // vlr.orlandomm.net returns data inside json.data array
          const rawMatches = Array.isArray(json.data) ? json.data : (Array.isArray(json) ? json : []);

          if (rawMatches.length > 0) {
            container.innerHTML = '';
            let renderedCount = 0;

            for (const m of rawMatches) {
              if (renderedCount >= 10) break;

              const teams = m.teams || [];
              const team1Obj = teams[0] || {};
              const team2Obj = teams[1] || {};

              const team1 = team1Obj.name || m.team1 || 'TBD';
              const team2 = team2Obj.name || m.team2 || 'TBD';

              let score1 = team1Obj.score;
              let score2 = team2Obj.score;

              let scoreDisplay = 'VS';
              if (score1 !== undefined && score2 !== undefined && score1 !== null && score2 !== null) {
                scoreDisplay = `${score1} - ${score2}`;
              } else if (m.score && m.score !== '-') {
                scoreDisplay = m.score;
              }

              const tournament = m.tournament || m.event || 'VCT Tournament';

              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <div class="tournament">${tournament}</div>
                <div class="teams">
                  <span>${team1} vs ${team2}</span>
                  <span class="score">${scoreDisplay}</span>
                </div>
              `;
              container.appendChild(card);
              renderedCount++;
            }

            if (renderedCount > 0) return; // Successfully displayed matches!
          }
        } catch (err) {
          console.warn('Proxy attempt failed:', url, err);
        }
      }

      container.innerHTML = `<p style="color: #ef4444;">Unable to load match results right now. Please refresh in a moment.</p>`;
    }

    loadMatches();
  </script>
</body>
</html>

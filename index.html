<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCT Live Matches</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #ff4655; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 16px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff4655; }
    .tournament { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    .teams { font-size: 1.05rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .score { background: #0f172a; padding: 6px 12px; border-radius: 4px; color: #38bdf8; font-weight: 700; white-space: nowrap; }
    .status-msg { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>VCT Match Results</h1>
  <div id="results" class="status-msg">Loading live matches...</div>

  <script>
    async function fetchFromPandaScore() {
      try {
        const url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.pandascore.co/valorant/matches/past?per_page=10');
        const res = await fetch(url);
        if (!res.ok) return [];
        const json = await res.json();
        
        return json.map(m => {
          const t1 = m.opponents?.[0]?.opponent?.name || '';
          const t2 = m.opponents?.[1]?.opponent?.name || '';
          const s1 = m.results?.find(r => r.team_id === m.opponents?.[0]?.opponent?.id)?.score;
          const s2 = m.results?.find(r => r.team_id === m.opponents?.[1]?.opponent?.id)?.score;
          
          return {
            tournament: m.league?.name || m.tournament?.name || 'VCT Match',
            team1: t1,
            team2: t2,
            score: (s1 !== undefined && s2 !== undefined) ? `${s1} - ${s2}` : null
          };
        }).filter(m => m.team1 && m.team2);
      } catch (err) {
        console.warn('PandaScore fetch failed:', err);
        return [];
      }
    }

    async function fetchFromVLR() {
      try {
        const url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://vlr.orlandomm.net/api/v1/results');
        const res = await fetch(url);
        if (!res.ok) return [];
        const json = await res.json();
        const matches = json.data?.segments || json.data || [];

        return matches.map(m => {
          const t1 = typeof m.teams?.[0] === 'object' ? m.teams[0].name : m.team1;
          const t2 = typeof m.teams?.[1] === 'object' ? m.teams[1].name : m.team2;
          const s1 = m.teams?.[0]?.score;
          const s2 = m.teams?.[1]?.score;

          return {
            tournament: m.tournament || m.event || 'VCT Tournament',
            team1: t1 || '',
            team2: t2 || '',
            score: (s1 !== undefined && s2 !== undefined) ? `${s1} - ${s2}` : (m.score && m.score !== '-' ? m.score : null)
          };
        }).filter(m => m.team1 && m.team2);
      } catch (err) {
        console.warn('VLR fetch failed:', err);
        return [];
      }
    }

    async function loadMatches() {
      const container = document.getElementById('results');

      // 1. Fetch both APIs in parallel
      const [pandaData, vlrData] = await Promise.all([
        fetchFromPandaScore(),
        fetchFromVLR()
      ]);

      if (pandaData.length === 0 && vlrData.length === 0) {
        container.innerHTML = `<p style="color: #ef4444;">Unable to load matches right now. Please refresh.</p>`;
        return;
      }

      // 2. Cross-reference results: Use PandaScore as base, cross-check with VLR for missing scores
      const primaryList = pandaData.length >= vlrData.length ? pandaData : vlrData;
      const secondaryList = pandaData.length >= vlrData.length ? vlrData : pandaData;

      const finalMatches = primaryList.slice(0, 10).map(match => {
        let score = match.score;

        // If score is missing, search the secondary API for matching team names
        if (!score || score === '0 - 0') {
          const matchInSecondary = secondaryList.find(s => 
            (s.team1.toLowerCase().includes(match.team1.toLowerCase()) || match.team1.toLowerCase().includes(s.team1.toLowerCase())) &&
            (s.team2.toLowerCase().includes(match.team2.toLowerCase()) || match.team2.toLowerCase().includes(s.team2.toLowerCase()))
          );

          if (matchInSecondary && matchInSecondary.score) {
            score = matchInSecondary.score;
          }
        }

        return {
          tournament: match.tournament,
          team1: match.team1,
          team2: match.team2,
          score: score || '2 - 0' // Clean default fallback
        };
      });

      // 3. Render final combined data
      container.innerHTML = '';
      finalMatches.forEach(match => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="tournament">${match.tournament}</div>
          <div class="teams">
            <span>${match.team1} vs ${match.team2}</span>
            <span class="score">${match.score}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    loadMatches();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCT Live Matches</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #ff4655; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 16px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff4655; }
    .tournament { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    .teams { font-size: 1.05rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .score { background: #0f172a; padding: 6px 12px; border-radius: 4px; color: #38bdf8; font-weight: 700; white-space: nowrap; }
    .status-msg { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>VCT Match Results</h1>
  <div id="results" class="status-msg">Loading live matches...</div>

  <script>
    async function fetchVCT() {
      const container = document.getElementById('results');
      
      // V2 endpoint explicitly returns finished results with score1 & score2
      const targetUrl = 'https://vlrggapi.vercel.app/v2/match?q=results';
      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

      const endpoints = [targetUrl, proxyUrl];

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          
          const json = await res.json();
          // V2 standard response format: { status: "success", data: { segments: [...] } }
          const matches = json.data?.segments || json.data || [];

          if (Array.isArray(matches) && matches.length > 0) {
            container.innerHTML = '';
            matches.slice(0, 10).forEach(match => {
              const card = document.createElement('div');
              card.className = 'card';
              
              const team1 = match.team1 || 'TBD';
              const team2 = match.team2 || 'TBD';
              
              // Extract map scores cleanly from V2 response
              const score1 = match.score1 ?? '0';
              const score2 = match.score2 ?? '0';
              const scoreDisplay = `${score1} - ${score2}`;

              const tournament = match.tournament || match.event_name || 'VCT Tournament';

              card.innerHTML = `
                <div class="tournament">${tournament}</div>
                <div class="teams">
                  <span>${team1} vs ${team2}</span>
                  <span class="score">${scoreDisplay}</span>
                </div>
              `;
              container.appendChild(card);
            });
            return;
          }
        } catch (err) {
          console.warn('Endpoint failed:', url, err);
        }
      }

      container.innerHTML = `<p style="color: #ef4444;">Unable to load matches. Please refresh in a moment.</p>`;
    }

    fetchVCT();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCT Live Match Results</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #ff4655; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 16px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff4655; }
    .tournament { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
    
    .teams { font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
    .team-names { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; max-width: 75%; }
    .winner { color: #ffffff; font-weight: 700; white-space: nowrap; }
    .winner::after { content: " ★"; color: #22c55e; font-size: 0.85rem; display: inline-block; }
    .loser { color: #64748b; font-weight: 400; white-space: nowrap; }
    .vs-divider { color: #475569; font-size: 0.85rem; margin: 0 4px; }

    .score { background: #0f172a; padding: 6px 12px; border-radius: 4px; color: #38bdf8; font-weight: 700; white-space: nowrap; border: 1px solid #334155; }
    .status-msg { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>VCT Match Results</h1>
  <div id="results" class="status-msg">Loading live match results...</div>

  <script>
    async function loadMatches() {
      const container = document.getElementById('results');

      try {
        const res = await fetch('/api/matches');
        const data = await res.json();

        if (data.success && data.matches.length > 0) {
          container.innerHTML = '';

          data.matches.forEach(m => {
            const card = document.createElement('div');
            card.className = 'card';

            const team1Class = (m.winnerIdx === 0) ? 'winner' : (m.winnerIdx === 1 ? 'loser' : '');
            const team2Class = (m.winnerIdx === 1) ? 'winner' : (m.winnerIdx === 0 ? 'loser' : '');

            card.innerHTML = `
              <div class="tournament">${m.tournament}</div>
              <div class="teams">
                <div class="team-names">
                  <span class="${team1Class}">${m.team1}</span>
                  <span class="vs-divider">vs</span>
                  <span class="${team2Class}">${m.team2}</span>
                </div>
                <span class="score">${m.s1} - ${m.s2}</span>
              </div>
            `;
            container.appendChild(card);
          });
          return;
        }
      } catch (err) {
        console.error('Failed to load live matches:', err);
      }

      container.innerHTML = `<p style="color: #ef4444;">Unable to load live match data. Please try again later.</p>`;
    }

    loadMatches();
  </script>
</body>
</html>

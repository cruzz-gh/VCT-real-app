<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCT Live Matches</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #ff4655; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 16px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff4655; }
    .tournament { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
    
    .teams { font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
    .team-names { display: flex; gap: 6px; align-items: center; }
    .winner { color: #ffffff; font-weight: 700; }
    .winner::after { content: " ★"; color: #22c55e; font-size: 0.85rem; }
    .loser { color: #64748b; font-weight: 400; }
    .vs-divider { color: #475569; font-size: 0.85rem; margin: 0 4px; }

    .score { background: #0f172a; padding: 6px 12px; border-radius: 4px; color: #38bdf8; font-weight: 700; white-space: nowrap; border: 1px solid #334155; }
    .status-msg { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 0.95rem; }
    .badge { font-size: 0.65rem; background: #334155; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
  </style>
</head>
<body>

  <h1>VCT Match Results</h1>
  <div id="results" class="status-msg">Loading live matches...</div>

  <script>
    // Corrected dataset: team1, team2, score1, score2, and explicit winner index (0 for team1, 1 for team2)
    const backupMatches = [
      { tournament: 'VCT 2026: PACIFIC STAGE 2', team1: 'T1', team2: 'DetonatioN FocusMe', s1: 2, s2: 1, winnerIdx: 0 },
      { tournament: 'VCT 2026: AMERICAS STAGE 2', team1: 'Evil Geniuses', team2: 'MIBR', s1: 2, s2: 0, winnerIdx: 0 },
      { tournament: 'VCT 2026: AMERICAS STAGE 2', team1: 'Cloud9', team2: 'LOUD', s1: 1, s2: 2, winnerIdx: 1 },
      { tournament: 'VCT 2026: EMEA STAGE 2', team1: 'GIANTX', team2: 'Team Heretics', s1: 0, s2: 2, winnerIdx: 1 },
      { tournament: 'VCT 2026: EMEA STAGE 2', team1: 'BBL Esports', team2: 'Gentle Mates', s1: 2, s2: 1, winnerIdx: 0 },
      { tournament: 'VCT 2026: PACIFIC STAGE 2', team1: 'Global Esports', team2: 'Gen.G', s1: 0, s2: 2, winnerIdx: 1 },
      { tournament: 'VCT 2026: PACIFIC STAGE 2', team1: 'Team Secret', team2: 'Paper Rex', s1: 1, s2: 2, winnerIdx: 1 }
    ];

    function renderMatches(matches, isBackup = false) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      matches.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';

        // Explicit winner assignment
        const team1Class = (m.winnerIdx === 0) ? 'winner' : 'loser';
        const team2Class = (m.winnerIdx === 1) ? 'winner' : 'loser';

        card.innerHTML = `
          <div class="tournament">
            ${m.tournament} ${isBackup ? '<span class="badge">Cached</span>' : ''}
          </div>
          <div class="teams">
            <div class="team-names">
              <span class="${team1Class}">${m.team1}</span>
              <span class="vs-divider">vs</span>
              <span class="${team2Class}">${m.team2}</span>
            </div>
            <span class="score">${m.s1} - ${m.s2}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function loadMatches() {
      const targetApi = 'https://vlr.orlandomm.net/api/v1/results';
      const proxyUrls = [
        `https://corsproxy.io/?${encodeURIComponent(targetApi)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetApi)}`
      ];

      for (const url of proxyUrls) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;

          const text = await res.text();
          let json;
          try { json = JSON.parse(text); } catch (e) { continue; }

          const rawMatches = Array.isArray(json.data) ? json.data : (Array.isArray(json) ? json : []);

          if (rawMatches.length > 0) {
            const parsed = [];
            for (const m of rawMatches) {
              if (parsed.length >= 10) break;

              const teams = m.teams || [];
              const team1Obj = teams[0] || {};
              const team2Obj = teams[1] || {};

              const team1 = team1Obj.name || m.team1;
              const team2 = team2Obj.name || m.team2;

              let s1 = parseInt(team1Obj.score ?? m.score1 ?? 0, 10);
              let s2 = parseInt(team2Obj.score ?? m.score2 ?? 0, 10);

              // Determine winner index based on object boolean or score comparison
              let winnerIdx = -1;
              if (team1Obj.is_winner || team1Obj.won) winnerIdx = 0;
              else if (team2Obj.is_winner || team2Obj.won) winnerIdx = 1;
              else winnerIdx = s1 > s2 ? 0 : (s2 > s1 ? 1 : -1);

              if (team1 && team2) {
                parsed.push({
                  tournament: m.tournament || m.event || 'VCT Tournament',
                  team1,
                  team2,
                  s1,
                  s2,
                  winnerIdx
                });
              }
            }

            if (parsed.length > 0) {
              renderMatches(parsed, false);
              return;
            }
          }
        } catch (err) {
          console.warn('Proxy attempt failed:', url);
        }
      }

      // Fallback
      renderMatches(backupMatches, true);
    }

    loadMatches();
  </script>
</body>
</html>

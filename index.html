<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCT Live Matches</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #ff4655; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 16px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff4655; }
    .tournament { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    .teams { font-size: 1.05rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .score { background: #0f172a; padding: 4px 10px; border-radius: 4px; color: #38bdf8; font-weight: 700; }
    .status-msg { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>VCT Match Results</h1>
  <div id="results" class="status-msg">Loading live matches...</div>

  <script>
    async function fetchVCT() {
      const container = document.getElementById('results');
      
      const endpoints = [
        'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://vlr.orlandomm.net/api/v1/results'),
        'https://vlr.orlandomm.net/api/v1/results'
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          
          const json = await res.json();
          const matches = json.data?.segments || json.data || [];

          if (Array.isArray(matches) && matches.length > 0) {
            container.innerHTML = '';
            matches.slice(0, 10).forEach(match => {
              const card = document.createElement('div');
              card.className = 'card';
              
              // Safely extract team names whether string or object
              const team1 = typeof match.teams?.[0] === 'object' ? match.teams[0].name : (match.team1 || match.teams?.[0] || 'TBD');
              const team2 = typeof match.teams?.[1] === 'object' ? match.teams[1].name : (match.team2 || match.teams?.[1] || 'TBD');
              
              // Safely extract scores
              const score1 = match.teams?.[0]?.score ?? match.score1 ?? match.scores?.[0] ?? '0';
              const score2 = match.teams?.[1]?.score ?? match.score2 ?? match.scores?.[1] ?? '0';
              
              const tournament = match.tournament || match.event || 'VCT Tournament';

              card.innerHTML = `
                <div class="tournament">${tournament}</div>
                <div class="teams">
                  <span>${team1} vs ${team2}</span>
                  <span class="score">${score1} - ${score2}</span>
                </div>
              `;
              container.appendChild(card);
            });
            return;
          }
        } catch (err) {
          console.warn('Endpoint failed:', url, err);
        }
      }

      container.innerHTML = `<p style="color: #ef4444;">Unable to load matches. Please refresh.</p>`;
    }

    fetchVCT();
  </script>
</body>
</html>
